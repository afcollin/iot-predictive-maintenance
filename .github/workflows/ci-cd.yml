name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint og test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit- og integrationstests (pytest)
        run: pytest --cov=app --cov-report=term-missing
      - name: Valider infrastruktur som kode (Bicep)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  security:
    name: Sikkerhedsscanning (DevSecOps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hele historikken, så secret scanning også finder hemmeligheder i gamle commits
      - name: Secret scanning - hemmeligheder i git-historikken (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner -v
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: SAST - statisk analyse af koden (bandit)
        run: bandit -r app -ll
      - name: SCA - kendte sårbarheder i afhængigheder (pip-audit)
        run: pip-audit -r requirements.txt

  build:
    name: Docker build, smoke test, DAST og publish
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_KEY: ci-smoke-test-key
      RATE_LIMIT_PER_MINUTE: "0" # slået fra i CI, så DAST-scanningen ikke bremses af 429-svar
    steps:
      - uses: actions/checkout@v7

      - name: Byg og start API og database
        run: docker compose up -d --build --wait db api

      - name: Smoke test af event-flowet
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS -X POST http://localhost:8000/api/v1/sensor-readings \
            -H "X-API-Key: $API_KEY" -H "Content-Type: application/json" \
            -d '{"asset_id":"WTG-CI-01","device_id":"SNS-CI-01","metric":"gearbox_vibration","value":12.5}'
          echo
          curl -fsS "http://localhost:8000/api/v1/alarms?asset_id=WTG-CI-01" -H "X-API-Key: $API_KEY" | tee alarms.json
          grep -q '"status":"OPEN"' alarms.json

      - name: DAST - angreb mod den kørende API (OWASP ZAP API scan)
        run: |
          mkdir -p zap && chmod 777 zap
          # Scanner alle endpoints fra OpenAPI-specifikationen med API-nøglen sat på hvert kald.
          # Fund på FAIL-niveau stopper pipelinen; advarsler kommer med i rapporten.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi -r zap-rapport.html -I \
            -z "-config replacer.full_list(0).description=apikey -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=X-API-Key \
                -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=$API_KEY"

      - name: Gem DAST-rapporten
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-rapport
          path: zap/zap-rapport.html
          if-no-files-found: ignore

      - name: Vis container-logs ved fejl
        if: failure()
        run: docker compose logs

      - name: Publicér image til GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag iot-predictive-maintenance:local "$IMAGE:latest"
          docker tag iot-predictive-maintenance:local "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"

      - name: Ryd op
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy til Azure Container Apps
    needs: [build]
    # Kun fra main, og kun når Azure er sat op (infra/deploy.ps1 opretter variablerne)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency: azure-production
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC: GitHub udsteder et kortlivet token, Azure stoler på det. Ingen gemte adgangskoder
    steps:
      - name: Log ind i Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Flyt det testede image fra GHCR til Azure Container Registry
        run: |
          set -euo pipefail
          SOURCE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          TARGET="${{ vars.AZURE_ACR_NAME }}.azurecr.io/iot-predictive-maintenance:sha-${GITHUB_SHA::7}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SOURCE"
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "IMAGE=$TARGET" >> "$GITHUB_ENV"

      - name: Deploy ny revision
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" --output none

      - name: Smoke test i Azure
        run: |
          set -euo pipefail
          APP="${{ vars.AZURE_CONTAINERAPP_NAME }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for i in $(seq 1 30); do
            LATEST=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            READY=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
            [ "$LATEST" = "$READY" ] && break
            echo "Venter på at revision $LATEST bliver klar..."; sleep 10
          done
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$FQDN/health"
          echo
          echo "### Deployet til https://$FQDN/docs" >> "$GITHUB_STEP_SUMMARY"
